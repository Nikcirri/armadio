apply plugin: 'com.android.application'

android {
    namespace = "com.nikcirri.armadio"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nikcirri.armadio"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Numero e nome versione arrivano da GitHub Actions (tag v0.0.1 -> "0.0.1").
        versionCode = Integer.parseInt(System.getenv("APP_VERSION_CODE") ?: "1")
        versionName = System.getenv("APP_VERSION_NAME") ?: "0.0.0-dev"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Solo telefoni ARM (SPEC.md, sezione 1): le librerie native per x86 servono solo agli emulatori
        // e pesavano circa 19 MB (soprattutto il rilevamento volti di ML Kit).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // La chiave di firma NON è nel repository: GitHub Actions la ricrea dai Secrets.
    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            def ksPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            if (ksPath && ksPassword) {
                storeFile = file(ksPath)
                storePassword = ksPassword
                keyAlias = "armadio"
                keyPassword = ksPassword
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH") && System.getenv("ANDROID_KEYSTORE_PASSWORD")) {
                signingConfig = signingConfigs.release
            }
            // R8 riduce il codice delle librerie grandi; le regole prudenti sono in proguard-rules.pro
            // e scripts/check_apk.py controlla l'APK prima della pubblicazione (SPEC.md, sezione 2).
            // Le risorse non vengono ridotte: alcuni plugin le cercano per nome (es. splash, suoni).
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Scontorno AI (CutoutPlugin.java): stessa versione usata da @capacitor-mlkit/subject-segmentation.
    implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
    // Armocromia (FacePlugin.java): rilevamento volti con il modello incluso nell'app (funziona offline).
    implementation "com.google.mlkit:face-detection:16.1.7"
    // Blocco dell'app (AppLockPlugin.java): impronta, volto o PIN del telefono.
    implementation "androidx.biometric:biometric:1.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
