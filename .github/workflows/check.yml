# Controlla il codice a ogni modifica (non crea l'APK).
name: Controllo

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
